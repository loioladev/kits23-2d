# Full-scale UNet training. Tuned for a single 8 GB GPU at 512x512.
dataset_dir: kits23-2d
size: 512
in_channels: 3

arch: unetplusplus
encoder: resnet34
encoder_weights: imagenet
attention: ""

loss: dicece
dice_weight: 0.38254534577572263
ce_weight: 0.5
monitor: mean_dice

epochs: 30
batch_size: 4
lr: 1.329291894316216e-4
weight_decay: 6.351221010640704e-3
optimizer: adamw
scheduler: cosine
warmup_iters: 250
amp: true
patience: 6

empty_ratio: 1.0
aug_strength: light

num_workers: 8
experiment: kits23-seg
output_dir: runs/seg-unet-resnet34
log_images: 8
