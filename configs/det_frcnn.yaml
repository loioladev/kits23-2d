# Full-scale Faster R-CNN training. Batch size 4 is about the ceiling for
# resnet50-fpn-v2 at 512x512 on 8 GB with AMP on; use --arch mobilenet for more.
dataset_dir: kits32-2d
size: 512

arch: resnet50
pretrained: true
trainable_backbone_layers: 3
min_box_size: 4.0
score_threshold: 0.5
monitor: mAP

epochs: 20
batch_size: 4
lr: 5.0e-5
weight_decay: 1.0e-4
optimizer: adamw
scheduler: cosine
# Faster R-CNN diverges easily while the freshly initialized box head is still
# random, so the warmup here is longer than the segmentation one.
warmup_iters: 500
clip_grad: 10.0
amp: true
patience: 5

# Empty slices produce no detection loss signal beyond background, so trimming
# them speeds up an epoch considerably at little cost.
empty_ratio: 0.3
aug_strength: medium

num_workers: 8
experiment: kits23-det
output_dir: runs/det-frcnn-r50
log_images: 4
